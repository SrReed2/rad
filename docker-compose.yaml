services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./alembic.ini:/app/alembic.ini
      - ./migration:/app/migration
    networks:
      - app-network
    working_dir: /app
    environment:
      DATABASE_URL: postgresql://raduser:1234@db:5432/rad_db
      SECRET_KEY: change-this-in-production
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    networks:
      - app-network

  db:
    image: postgres:13
    environment:
      POSTGRES_USER: raduser
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: rad_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network

volumes:
  pgdata:
  node_modules:

networks:
  app-network:
    driver: bridge

